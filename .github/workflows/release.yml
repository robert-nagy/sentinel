name: Release

# Changesets flow: on every push to main, either opens/updates a
# "chore: version packages" PR (when unreleased changesets exist) or, once that
# PR is merged, tags the new version (vX.Y.Z) and creates a GitHub Release.
#
# Nothing is published to npm: sentinel is distributed as a plugin marketplace
# from this repository (docs/adr/0006-marketplace-distribution.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:plugin
      # Guard the tag: with no pending changesets the next step may tag a release, so the
      # committed bundle must equal a fresh build of src/. Between releases the bundle is
      # allowed to lag behind main (ADR-0006), so the check is skipped while changesets wait.
      - name: Bundle matches source (before tagging)
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv 'README.md'; then
            echo "pending changesets: bundle is refreshed by the version PR, skipping"
          else
            node scripts/build-plugin.js --verify-fresh
          fi
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version-packages
          # `changeset tag` creates the vX.Y.Z tag for the private package; the
          # action pushes it and creates the GitHub Release.
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so the version PR would sit
      # with no checks at all. Dispatch them explicitly; runs on that branch attach to the PR.
      - name: Run checks on the version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run security.yml --ref changeset-release/main
