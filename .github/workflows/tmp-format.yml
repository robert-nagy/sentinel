# TEMPORARY: runs prettier --write (the authoring environment cannot install it). Removed in a follow-up commit.
name: Temporary format

on:
  push:
    branches: [m1/prune-code-host]
    paths: [.github/workflows/tmp-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/tmp-format.yml'
          git diff --cached --quiet && { echo "nothing to format"; exit 0; }
          git commit -m "style: prettier formatting"
          git push
