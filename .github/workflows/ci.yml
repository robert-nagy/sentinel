name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Plugin is consistent
        run: npm run check:plugin

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (with coverage gate)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - name: Unit tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      - name: E2E tests (built CLI)
        run: npm run test:e2e

  plugin-install:
    name: Plugin install E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci installs only the test runner: the test copies the plugin out of the repo as a
      # marketplace install would and runs each skill's committed bundle from that copy.
      - run: npm ci
      # Pinned so a Claude Code release cannot break PRs unannounced; bump it on purpose.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Install the plugin from each marketplace and run every skill's bundled CLI
        env:
          # With the CLI on PATH the test also validates and does a real `claude plugin install`.
          SENTINEL_REQUIRE_CLAUDE: '1'
        run: npx vitest run --config vitest.e2e.config.ts test/e2e/plugin-install.test.ts
