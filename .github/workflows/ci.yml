name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (with coverage gate)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - name: Unit tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      - name: E2E tests (built CLI)
        run: npm run test:e2e

  package:
    name: Pack & install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack tarball
        run: |
          npm pack
          tar -tzf robert-nagy-sentinel-*.tgz
      - name: Install tarball globally
        run: npm install --global ./robert-nagy-sentinel-*.tgz
      - name: Smoke test installed binary
        working-directory: ${{ runner.temp }}
        run: |
          sentinel --version
          sentinel --help
          sentinel doctor
