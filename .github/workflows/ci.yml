name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (with coverage gate)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - name: Unit tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      - name: E2E tests (built CLI)
        run: npm run test:e2e

  smoke:
    name: Smoke test built CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # sentinel is not published to npm (ADR-0006), so there is no tarball to
      # install. Run the built CLI from outside the repository, the way a
      # plugin install will invoke it.
      - name: Run the built CLI from another directory
        working-directory: ${{ runner.temp }}
        env:
          SENTINEL_BIN: ${{ github.workspace }}/dist/bin/sentinel.js
        run: |
          node "$SENTINEL_BIN" --version
          node "$SENTINEL_BIN" --help
          node "$SENTINEL_BIN" doctor
