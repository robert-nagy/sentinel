name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Plugin is consistent
        run: npm run check:plugin

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests (with coverage gate)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - name: Unit tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      - name: E2E tests (built CLI)
        run: npm run test:e2e

  plugin-smoke:
    name: Plugin smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No npm install: a plugin install is a git clone, so the committed bundle must run
      # as it is. Copy one skill folder away from the repo and run it the way a skill does.
      - name: Run the bundled CLI from a copied skill folder
        env:
          SKILL_SRC: ${{ github.workspace }}/plugins/sentinel/skills/sentinel-doctor
        run: |
          cp -r "$SKILL_SRC" "$RUNNER_TEMP/skill"
          cd "$RUNNER_TEMP/skill"
          node scripts/sentinel.mjs --version
          node scripts/sentinel.mjs --help
          node scripts/sentinel.mjs doctor --json

  plugin-validate:
    name: Claude Code plugin validate (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/sentinel
