name: Release

# Changesets flow: on every push to main, either opens/updates a
# "chore: version packages" PR (when unreleased changesets exist) or, once that
# PR is merged, publishes the new version to npm with provenance.
#
# Disabled until the repository variable SENTINEL_RELEASE_ENABLED is set to
# "true" (Settings → Secrets and variables → Actions → Variables), so nothing is
# published before npm is configured. Publishing uses npm trusted publishing
# (OIDC): add this workflow as a trusted publisher for @robert-nagy/sentinel on
# npmjs.com. Alternatively, set an NPM_TOKEN secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    if: vars.SENTINEL_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing support
        run: npm install --global npm@^11.5.1
      - name: Let npm fall through to OIDC when there is no NPM_TOKEN
        # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` into
        # .npmrc. With no NPM_TOKEN secret that line expands to an empty token,
        # which npm can mistake for configured credentials and then skip the
        # trusted-publishing (OIDC) login, failing with ENEEDAUTH. Remove the line
        # unless a token was actually provided.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "No NPM_TOKEN: publishing with OIDC trusted publishing"
          else
            echo "NPM_TOKEN present: publishing with token"
          fi
      - run: npm ci
      - run: npm run check
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Show npm's own error on failure
        # changesets/action hides npm's stderr. Surface the auth-related lines
        # (npm redacts secrets in its logs).
        if: failure()
        run: grep -h -iE 'oidc|trusted|exchange|ENEEDAUTH|E40[134]' ~/.npm/_logs/*.log | head -40 || true
