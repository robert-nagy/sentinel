name: tmp-build-plugin
on:
  push:
    branches: [m3/skills]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:plugin
      - run: npx prettier --write src test .changeset plugins/sentinel/skills plugins/sentinel/agents
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: rebuild plugin bundle and format"
          git push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:plugin
