name: tmp-build-plugin
on:
  push:
    branches: [m2.5/plugin-bundle]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:plugin
      - run: npx prettier --write scripts test tsup.bundle.config.ts eslint.config.js vitest.config.ts package.json .changeset plugins/sentinel/skills
      - run: npm run lint && npm run typecheck && npm test && npm run check:plugin
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: generate plugin bundle and manifests"
          git push
