# TEMPORARY: generates package-lock.json once for the M0 branch (the authoring
# environment had no npm registry access). Removed in the next commit.
name: Bootstrap lockfile

on:
  push:
    branches: [chore/m0-foundation]
    paths: [package.json, .github/workflows/bootstrap-lockfile.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json"
          git push
