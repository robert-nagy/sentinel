# TEMPORARY: adds new dependencies to package-lock.json (the authoring environment
# has no npm registry access). Removed in a follow-up commit.
name: Bootstrap lockfile

on:
  push:
    branches: [m1/config-branch-namer]
    paths: [package.json, .github/workflows/bootstrap-lockfile.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "lockfile unchanged"; exit 0; }
          git commit -m "chore: update package-lock.json (zod)"
          git push
